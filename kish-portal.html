<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--white:#fff;--primary:#5C6BC0;--primary2:#3949AB;
  --accent:#FF7043;--green:#43A047;--red:#E53935;
  --text:#1a1a2e;--sub:#888;--border:#e0e0e0;
  --card:0 2px 8px rgba(0,0,0,0.08);
}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}

/* TOP BAR */
.topbar{background:var(--primary);padding:16px 16px 0;position:sticky;top:0;z-index:1100}
.topbar-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.home-link{color:#fff;text-decoration:none;font-size:18px;line-height:1}
.topbar-title{color:#fff;font-size:18px;font-weight:900;letter-spacing:-0.5px}
.tab-row{display:flex}
.tab-btn{flex:1;padding:10px 0;border:none;background:transparent;color:rgba(255,255,255,0.6);font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s}
.tab-btn.active{color:#fff;border-bottom-color:#fff}
.banner{background:#FFF3E0;border-bottom:1px solid #FFE0B2;color:#E65100;font-size:12px;font-weight:700;padding:10px 16px;line-height:1.5}

/* PAGES */
.page{display:none;padding:16px}
.page.active{display:block}
.card{background:var(--white);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--card)}
.card-title{font-size:11px;font-weight:800;color:var(--sub);letter-spacing:0.08em}
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.list-head select{border:1.5px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;color:var(--text);background:#fff}

/* MAP */
.map-wrap{position:relative;isolation:isolate;border-radius:16px;overflow:hidden;box-shadow:var(--card);margin-bottom:10px;background:#e8eaf0}
#map{height:320px}
.map-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-92%);font-size:38px;line-height:1;z-index:500;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.map-btn{position:absolute;right:10px;bottom:24px;z-index:500;width:42px;height:42px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:20px;cursor:pointer}
.map-fail{display:flex;align-items:center;justify-content:center;height:100%;font-size:13px;color:var(--sub);text-align:center;padding:20px;line-height:1.6}
.pin{background:none;border:none}
.pin-b{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:2px solid var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.pin-b span{transform:rotate(45deg);font-size:17px;line-height:1}
.pop b{display:block;font-size:14px;margin-bottom:4px}
.pop p{font-size:12px;margin:0 0 6px!important;line-height:1.5;white-space:pre-wrap}
.pop-meta{font-size:11px;color:var(--sub)}

/* SEARCH */
.search-row{display:flex;gap:6px;margin-bottom:10px}
.search-row input{flex:1;min-width:0;padding:11px 12px;border:1.5px solid var(--border);border-radius:12px;font-size:16px;font-weight:600;outline:none;background:#fff}
.search-row input:focus{border-color:var(--primary)}
.search-row button{padding:0 16px;border-radius:12px;border:none;background:var(--primary2);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.results{background:#fff;border-radius:12px;box-shadow:var(--card);margin-bottom:10px;overflow:hidden}
.result{display:block;width:100%;text-align:left;padding:11px 14px;border:none;border-bottom:1px solid #f0f0f0;background:#fff;font-size:12px;color:var(--sub);cursor:pointer;line-height:1.4}
.result:last-child{border-bottom:none}
.result b{display:block;font-size:13px;color:var(--text);margin-bottom:2px}

/* PICK MODE */
.pick-bar{background:#E8EAF6;border:1.5px solid #C5CAE9;border-radius:14px;padding:12px;margin-bottom:12px}
.pick-bar p{font-size:13px;font-weight:700;color:var(--primary2);text-align:center;margin-bottom:10px;line-height:1.5}

/* BUTTONS */
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;background:var(--primary);color:#fff;margin-bottom:12px}
.btn:active{transform:scale(0.98)}
.btn:disabled{opacity:0.6}
.btn.ghost{background:#fff;color:var(--sub);border:1.5px solid var(--border)}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1;margin-bottom:0}
.fab{position:fixed;right:18px;bottom:24px;z-index:1050;padding:14px 22px;border-radius:30px;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:800;box-shadow:0 4px 14px rgba(92,107,192,.45);cursor:pointer}

/* CHIPS / SEGMENTS */
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 12px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
.seg{display:flex;background:#e4e6eb;border-radius:12px;padding:3px;margin-bottom:14px;gap:3px}
.seg-btn{flex:1;padding:9px 4px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.seg-btn.on{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,0.1)}

/* LIST ITEMS */
.item{display:flex;gap:12px;background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--card)}
.card .item{box-shadow:none;border:1px solid #eee;padding:12px}
.item.done{opacity:0.55}
.item-ico{font-size:24px;flex-shrink:0;line-height:1.2}
.thumb{width:76px;height:76px;border-radius:10px;object-fit:cover;flex-shrink:0;cursor:pointer;background:#eee}
.item-body{flex:1;min-width:0}
.item-top{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.item-title{font-size:15px;font-weight:800;word-break:break-word}
.badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;flex-shrink:0}
.b-lost{background:#FFEBEE;color:var(--red)}
.b-found{background:#E8F5E9;color:var(--green)}
.b-done{background:#eee;color:var(--sub)}
.b-live{background:#E8EAF6;color:var(--primary)}
.b-mine{background:#FFF3E0;color:#E65100}
.item-desc{font-size:13px;line-height:1.55;margin-bottom:6px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.item-meta{font-size:11px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:9px}
.item-meta span{word-break:break-word}
.item-actions{display:flex;gap:6px;flex-wrap:wrap}
.act{padding:7px 12px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer}
.act:disabled{opacity:0.6;cursor:default}
.act.primary{border-color:var(--primary);color:var(--primary)}
.act.warn{border-color:#FFCDD2;color:var(--red)}
.act.on{background:var(--primary);border-color:var(--primary);color:#fff}
.hidden-post{font-size:12px;color:var(--sub);padding:12px 14px;background:#fff;border-radius:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--card)}
.empty{text-align:center;padding:40px 0;color:var(--sub);font-size:13px;line-height:1.6}
.empty-ico{font-size:40px;margin-bottom:10px}

/* SHEET (글쓰기 창) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1200;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;background:#fff;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:92vh;overflow-y:auto}
.sheet-title{font-size:17px;font-weight:900;margin-bottom:16px}
.sheet-close{position:absolute;top:14px;right:14px;border:none;background:#f0f0f0;width:32px;height:32px;border-radius:50%;font-size:14px;color:var(--sub);cursor:pointer}
.f-row{margin-bottom:12px}
.f-row label,.lbl{display:block;font-size:11px;font-weight:800;color:var(--sub);margin-bottom:6px}
.f-row input,.f-row textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-weight:600;color:var(--text);background:#fff;outline:none;resize:vertical}
.f-row input:focus,.f-row textarea:focus{border-color:var(--primary)}
.hint{font-size:11px;color:var(--sub);margin-top:5px;line-height:1.5}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-btn{padding:10px 14px;border-radius:10px;border:1.5px dashed var(--primary);background:#F5F6FC;color:var(--primary);font-size:13px;font-weight:700;cursor:pointer}
.photo-prev{position:relative}
.photo-prev img{width:64px;height:64px;border-radius:10px;object-fit:cover;display:block}
.photo-prev button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:none;background:#333;color:#fff;font-size:11px;cursor:pointer}

/* PHOTO VIEWER */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:1250;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:16px}
.viewer img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:6px}
.viewer .msg{color:#fff;font-size:13px}
.viewer .close-hint{color:rgba(255,255,255,0.6);font-size:12px}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(160px);background:#333;color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;font-weight:700;transition:transform 0.3s;z-index:1300;max-width:92vw;text-align:center;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-top">
    <a class="home-link" href="./" aria-label="홈으로">🏠</a>
    <div class="topbar-title">🏙️ KISH 생활 포털</div>
  </div>
  <div class="tab-row">
    <button class="tab-btn active" data-tab="map" onclick="goTab('map')">🍜 맛집지도</button>
    <button class="tab-btn" data-tab="lost" onclick="goTab('lost')">📢 분실물</button>

</div>
<div class="banner" id="setupBanner" hidden>✏️ 지금은 글 보기만 가능해요. 글쓰기는 곧 열려요!</div>

<!-- 맛집 지도 -->
<div class="page active" id="pg-map">
  <form class="search-row" onsubmit="searchPlace(event)">
    <input id="searchQ" type="search" placeholder="장소·거리 이름 검색 (예: Lotte Center)" autocomplete="off"/>
    <button type="submit">검색</button>
  </form>
  <div id="searchResults"></div>
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-pin" id="mapPin" hidden>📍</div>
    <button class="map-btn" id="locBtn" type="button" onclick="goMyLocation()" aria-label="내 위치">🧭</button>
  </div>
  <div class="pick-bar" id="pickBar" hidden>
    <p>지도를 움직여서 📍를 가게 위치에 맞춰주세요</p>
    <div class="btn-row">
      <button class="btn ghost" type="button" onclick="cancelPick()">취소</button>
      <button class="btn" type="button" onclick="confirmPick()">이 위치로 등록</button>
    </div>
  </div>
  <button class="btn" id="addPlaceBtn" type="button" onclick="startPick()">📍 맛집 추가하기</button>
  <div class="card">
    <div class="list-head">
      <div class="card-title">맛집 목록 (<span id="placeCount">0</span>)</div>
      <select id="placeSort" onchange="placeSort=this.value;renderPlaces()">
        <option value="new">최신순</option>
        <option value="like">추천순</option>
      </select>
    </div>
    <div class="chip-row" id="catFilter"></div>
    <div id="placeList"><div class="empty">불러오는 중…</div></div>
  </div>
</div>

<!-- 분실물 -->
<div class="page" id="pg-lost">
  <div class="seg">
    <button class="seg-btn on" data-act="lff" data-v="all">전체</button>
    <button class="seg-btn" data-act="lff" data-v="lost">🔍 찾아요</button>
    <button class="seg-btn" data-act="lff" data-v="found">🙌 주웠어요</button>
  </div>
  <div id="lfList"><div class="empty">불러오는 중…</div></div>
</div>

<!-- 나눔 -->
<div class="page" id="pg-share">
  <div class="seg">
    <button class="seg-btn on" data-act="shf" data-v="all">전체</button>
    <button class="seg-btn" data-act="shf" data-v="live">나눔중만 보기</button>
  </div>
  <div id="shList"><div class="empty">불러오는 중…</div></div>
</div>

<button class="fab" id="fab" type="button" hidden onclick="openWrite()">✏️ 글쓰기</button>

<!-- 맛집 등록 창 -->
<div class="overlay" id="placeSheet" hidden>
  <div class="sheet">
    <button class="sheet-close" type="button" onclick="closeSheet('placeSheet')">✕</button>
    <div class="sheet-title">📍 맛집 등록</div>
    <div class="f-row"><label for="pName">가게 이름</label><input id="pName" maxlength="30" placeholder="예) 퍼 24"/></div>
    <div class="lbl">카테고리</div>
    <div class="chip-row" id="pCat"></div>
    <div class="f-row"><label for="pMemo">한줄 추천 (선택)</label><textarea id="pMemo" rows="2" maxlength="150" placeholder="예) 국물이 진하고 양이 많아요"></textarea></div>
    <div class="f-row"><label for="pAuthor">닉네임 (선택)</label><input id="pAuthor" maxlength="20" placeholder="비워두면 익명으로 올라가요"/></div>
    <button class="btn" id="pSubmit" type="button" onclick="submitPlace()">등록하기</button>
  </div>
</div>

<!-- 분실물 글쓰기 창 -->
<div class="overlay" id="lostSheet" hidden>
  <div class="sheet">
    <button class="sheet-close" type="button" onclick="closeSheet('lostSheet')">✕</button>
    <div class="sheet-title">📢 분실물 글쓰기</div>
    <div class="seg">
      <button class="seg-btn on" type="button" data-act="lftype" data-v="lost">🔍 잃어버렸어요</button>
      <button class="seg-btn" type="button" data-act="lftype" data-v="found">🙌 주웠어요</button>
    </div>
    <div class="f-row"><label for="lfTitle">제목</label><input id="lfTitle" maxlength="40" placeholder="예) 검정 필통을 잃어버렸어요"/></div>
    <div class="f-row"><label for="lfDesc">설명 (선택)</label><textarea id="lfDesc" rows="3" maxlength="300" placeholder="색깔, 특징, 언제쯤인지 적어주세요"></textarea></div>
    <div class="f-row"><label for="lfLoc">장소 (선택)</label><input id="lfLoc" maxlength="30" placeholder="예) 3층 도서관"/></div>
    <div class="f-row"><label for="lfContact">연락 방법 (선택)</label><input id="lfContact" maxlength="30" placeholder="예) 10학년 3반으로 와주세요"/><div class="hint">누구나 볼 수 있어요. 전화번호 대신 학년·반을 적어주세요.</div></div>
    <div class="f-row">
      <div class="lbl">사진 (선택)</div>
      <div class="photo-pick"><button class="photo-btn" type="button" id="lfPhotoBtn" onclick="pickPhoto('lf')">📷 사진 추가</button><div class="photo-prev" id="lfPhotoPrev"></div></div>
    </div>
    <button class="btn" id="lfSubmit" type="button" onclick="submitLost()">올리기</button>
  </div>
</div>

<!-- 나눔 글쓰기 창 -->
<div class="overlay" id="shareSheet" hidden>
  <div class="sheet">
    <button class="sheet-close" type="button" onclick="closeSheet('shareSheet')">✕</button>
    <div class="sheet-title">🎁 나눔 글쓰기</div>
    <div class="f-row"><label for="shTitle">제목</label><input id="shTitle" maxlength="40" placeholder="예) 안 쓰는 영어 문제집 나눔해요"/></div>
    <div class="f-row"><label for="shDesc">설명 (선택)</label><textarea id="shDesc" rows="3" maxlength="300" placeholder="상태, 개수, 어떻게 받으면 되는지 적어주세요"></textarea></div>
    <div class="f-row"><label for="shContact">연락 방법 (선택)</label><input id="shContact" maxlength="30" placeholder="예) 11학년 2반으로 와주세요"/><div class="hint">누구나 볼 수 있어요. 전화번호 대신 학년·반을 적어주세요.</div></div>
    <div class="f-row">
      <div class="lbl">사진 (선택)</div>
      <div class="photo-pick"><button class="photo-btn" type="button" id="shPhotoBtn" onclick="pickPhoto('sh')">📷 사진 추가</button><div class="photo-prev" id="shPhotoPrev"></div></div>
    </div>
    <button class="btn" id="shSubmit" type="button" onclick="submitShare()">올리기</button>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" hidden onchange="onPhotoPicked(this)"/>

<div class="viewer" id="viewer" hidden onclick="closeViewer()">

  <div class="close-hint">화면을 누르면 닫혀요</div>

<script>
// ── 기본 도구 ──
var REPORT_LIMIT = 3;          // 신고가 이만큼 쌓이면 글을 가림
var POST_GAP_MS = 30000;       // 글은 30초에 한 번 (서버 규칙과 같은 값)
var CATS = [['분식','🍢'],['한식','🍚'],['베트남음식','🍜'],['카페','☕'],['패스트푸드','🍔'],['디저트','🍰'],['기타','🍴']];
var CAT_ICO = {}; CATS.forEach(function(c){ CAT_ICO[c[0]]=c[1]; });

function G(id){ return document.getElementById(id); }
function val(id){ return (G(id).value||'').trim(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(msg){ var t=G('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2600); }
function tsMs(v){ return v && typeof v.toMillis==='function' ? v.toMillis() : (typeof v==='number' ? v : Date.now()); }
function timeAgo(ms){
  var m=Math.floor((Date.now()-ms)/60000);
  if(m<1) return '방금 전'; if(m<60) return m+'분 전';
  var h=Math.floor(m/60); if(h<24) return h+'시간 전';
  var d=Math.floor(h/24); if(d<7) return d+'일 전';
  var t=new Date(ms); return (t.getMonth()+1)+'월 '+t.getDate()+'일';
}
// 서버에서 온 사진 문자열이 진짜 JPEG 사진인지 확인 (이상한 값은 화면에 넣지 않음)
function safeImg(s){ return typeof s==='string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(s); }
function emptyBox(ico,msg){ return '<div class="empty"><div class="empty-ico">'+ico+'</div>'+msg+'</div>'; }
function busy(id,on,label){ var b=G(id); if(on){ b.dataset.label=b.textContent; b.textContent=label||'올리는 중…'; } else if(b.dataset.label){ b.textContent=b.dataset.label; } b.disabled=on; }

// ── 익명 로그인 (회원가입 없이 "글 쓴 기기"를 구분) ──
var uid=null, authState='pending';
auth.onAuthStateChanged(function(u){
  if(u){ uid=u.uid; authState='ok'; G('setupBanner').hidden=true; rerenderAll(); return; }
  auth.signInAnonymously().catch(function(e){
    console.warn('익명 로그인 실패', e.code);
    authState='fail'; G('setupBanner').hidden=false;
  });
});
function requireAuth(fn){
  if(uid) return fn();
  toast(authState==='fail' ? '지금은 글 보기만 가능해요' : '연결 중이에요. 잠시 후 다시 눌러주세요');
}

// ── 데이터 (탭을 처음 열 때만 불러옴) ──
var data={places:null, lostfound:null, shares:null}, subs={};
var LIST_BOX={places:'placeList', lostfound:'lfList', shares:'shList'};
function subscribe(col){
  if(subs[col]) return;
  var q=db.collection(col).orderBy('createdAt','desc').limit(col==='places'?300:80);
  subs[col]=q.onSnapshot(function(snap){
    data[col]=snap.docs.map(function(d){ var x=d.data({serverTimestamps:'estimate'}); x.id=d.id; return x; });
    RENDER[col]();
  }, function(err){
    console.warn(col, err);
    G(LIST_BOX[col]).innerHTML=emptyBox('⚠️','글을 불러오지 못했어요.<br/>잠시 후 새로고침해주세요');
  });
}
function rerenderAll(){ Object.keys(data).forEach(function(c){ if(data[c]) RENDER[c](); }); }
function findPost(col,id){ return (data[col]||[]).filter(function(p){ return p.id===id; })[0]; }
function isHidden(p){ return (p.reporters||[]).length>=REPORT_LIMIT; }
function isMine(p){ return !!uid && p.ownerUid===uid; }

// ── 탭 ──
var curTab='map';
function goTab(id){
  curTab=id;
  document.querySelectorAll('.page').forEach(function(p){ p.classList.toggle('active', p.id==='pg-'+id); });
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===id); });
  G('fab').hidden = (id==='map');
  if(id==='map'){ subscribe('places'); if(map) setTimeout(function(){ map.invalidateSize(); },60); }
  if(id==='lost') subscribe('lostfound');
  if(id==='share') subscribe('shares');
  try{ history.replaceState(null,'','#'+id); }catch(e){}
}

/* ================= 맛집 지도 ================= */
// 처음 열리는 위치. 학교 좌표로 바꾸면 학교 주변이 먼저 보여요
var DEFAULT_CENTER=[21.02,105.80], DEFAULT_ZOOM=13;
var map=null, markers={}, fittedOnce=false, myLocMarker=null, searchMarker=null, searchHits=[];
var placeCat='all', placeSort='new', pCat='', picking=false, pendingPos=null;

if(window.L){
  // 지도는 하노이 주변만 (확대·이동 범위 제한)
  map=L.map('map',{minZoom:11, maxBounds:[[20.70,105.40],[21.40,106.15]], maxBoundsViscosity:0.8}).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
  // openstreetmap.org는 베트남 일부 통신사에서 막혀 있어서, 같은 OSM 데이터를 쓰는 CARTO 서버를 사용
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    subdomains:'abcd', maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
  }).addTo(map);
} else {
  G('map').innerHTML='<div class="map-fail">지도를 불러오지 못했어요.<br/>인터넷 연결을 확인하고 새로고침해주세요.</div>';
}

function pinIcon(cat){
  return L.divIcon({className:'pin', html:'<div class="pin-b"><span>'+(CAT_ICO[cat]||'🍴')+'</span></div>', iconSize:[34,34], iconAnchor:[17,41], popupAnchor:[0,-36]});
}
function placePopup(p){
  return '<div class="pop"><b>'+(CAT_ICO[p.category]||'')+' '+esc(p.name)+'</b>'+(p.memo?'<p>'+esc(p.memo)+'</p>':'')+
    '<div class="pop-meta">👍 '+(p.likes||[]).length+' · '+esc(p.category)+' · '+esc(p.author||'익명')+'</div></div>';
}
function renderPlaces(){
  var all=data.places||[];
  if(map){
    var keep={};
    all.forEach(function(p){
      if(isHidden(p) || typeof p.lat!=='number' || typeof p.lng!=='number') return;
      keep[p.id]=1;
      if(markers[p.id]) markers[p.id].setPopupContent(placePopup(p));
      else markers[p.id]=L.marker([p.lat,p.lng],{icon:pinIcon(p.category), title:p.name}).bindPopup(placePopup(p)).addTo(map);
    });
    Object.keys(markers).forEach(function(id){ if(!keep[id]){ map.removeLayer(markers[id]); delete markers[id]; } });
    // 처음 한 번만 등록된 맛집들이 다 보이게 맞춤
    var ids=Object.keys(keep);
    if(!fittedOnce && ids.length && !picking){
      fittedOnce=true;
      map.fitBounds(L.latLngBounds(ids.map(function(id){ return markers[id].getLatLng(); })),{padding:[40,40],maxZoom:15});
    }
  }
  var visibleCount=all.filter(function(p){ return !isHidden(p); }).length;
  G('placeCount').textContent=visibleCount;
  var list=all.filter(function(p){ return placeCat==='all' || p.category===placeCat; });
  if(placeSort==='like') list=list.slice().sort(function(a,b){ return (b.likes||[]).length-(a.likes||[]).length || tsMs(b.createdAt)-tsMs(a.createdAt); });
  if(!list.length){
    G('placeList').innerHTML=emptyBox('🍜', all.length ? '이 카테고리에는 아직 맛집이 없어요' : '아직 등록된 맛집이 없어요<br/>첫 맛집을 추가해보세요!');
    return;
  }
  G('placeList').innerHTML=list.map(function(p){
    var mine=isMine(p);
    if(isHidden(p)) return hiddenBox('places',p,mine);
    var likes=(p.likes||[]).length, liked=!!uid && (p.likes||[]).indexOf(uid)>=0;
    return '<div class="item"><div class="item-ico">'+(CAT_ICO[p.category]||'🍴')+'</div><div class="item-body">'+
      '<div class="item-top"><div class="item-title">'+esc(p.name)+'</div><span class="badge b-live">'+esc(p.category)+'</span>'+(mine?'<span class="badge b-mine">내 글</span>':'')+'</div>'+
      (p.memo?'<div class="item-desc">'+esc(p.memo)+'</div>':'')+
      '<div class="item-meta"><span>✍️ '+esc(p.author||'익명')+'</span><span>🕐 '+timeAgo(tsMs(p.createdAt))+'</span></div>'+
      '<div class="item-actions">'+
        '<button class="act'+(liked?' on':'')+'" data-act="like" data-id="'+esc(p.id)+'">👍 추천 '+likes+'</button>'+
        '<button class="act primary" data-act="focus" data-id="'+esc(p.id)+'">📍 지도에서 보기</button>'+
        tailButton('places',p,mine)+
      '</div></div></div>';
  }).join('');
}
function focusPlace(id){
  var m=markers[id]; if(!m||!map) return;
  G('map').scrollIntoView({behavior:'smooth',block:'center'});
  map.setView(m.getLatLng(),17);
  m.openPopup();
}

// 위치 고르기: 지도 가운데 📍를 가게에 맞추는 방식 (폰에서 손가락으로 찍는 것보다 정확함)
function startPick(){
  if(!map) return;
  requireAuth(function(){
    picking=true; map.closePopup();
    G('mapPin').hidden=false; G('pickBar').hidden=false; G('addPlaceBtn').hidden=true;
    G('map').scrollIntoView({behavior:'smooth',block:'center'});
  });
}
function cancelPick(){
  picking=false;
  G('mapPin').hidden=true; G('pickBar').hidden=true; G('addPlaceBtn').hidden=false;
}
function confirmPick(){
  if(map.getZoom()<16){
    map.setZoom(17);
    toast('정확한 위치를 위해 확대했어요. 📍를 다시 맞추고 눌러주세요');
    return;
  }
  var c=map.getCenter();
  pendingPos={lat:+c.lat.toFixed(6), lng:+c.lng.toFixed(6)};
  openSheet('placeSheet');
}
function submitPlace(){
  requireAuth(function(){
    var name=val('pName'), memo=val('pMemo'), author=val('pAuthor');
    if(!pendingPos){ toast('지도에서 위치를 먼저 정해주세요'); return; }
    if(!name){ toast('가게 이름을 적어주세요'); return; }
    if(!pCat){ toast('카테고리를 골라주세요'); return; }
    if(tooSoon()) return;
    busy('pSubmit',true,'등록 중…');
    createPost('places',{name:name,category:pCat,memo:memo,author:author,lat:pendingPos.lat,lng:pendingPos.lng,
      ownerUid:uid,createdAt:FV.serverTimestamp(),likes:[],reporters:[]}, null)
      .then(function(id){
        toast('✅ 맛집을 등록했어요!');
        closeSheet('placeSheet'); cancelPick();
        G('pName').value=''; G('pMemo').value=''; pCat=''; markChips('pCat','');
        placeCat='all'; markChips('catFilter','all');
        setTimeout(function(){ focusPlace(id); },300);
      })
      .catch(postErr)
      .then(function(){ busy('pSubmit',false); });
  });
}
function toggleLike(id){
  requireAuth(function(){
    var p=findPost('places',id); if(!p) return;
    var liked=(p.likes||[]).indexOf(uid)>=0;
    db.collection('places').doc(id).update({likes: liked ? FV.arrayRemove(uid) : FV.arrayUnion(uid)}).catch(writeErr);
  });
}

// 장소 검색 (openstreetmap.org 검색은 베트남에서 막혀 있어서 Photon 사용)
function searchPlace(e){
  e.preventDefault();
  var q=val('searchQ'); if(!q || !map) return;
  G('searchQ').blur();
  var box=G('searchResults');
  box.innerHTML='<div class="results"><div class="result">검색 중…</div></div>';
  var c=map.getCenter();
  fetch('https://photon.komoot.io/api/?limit=6&bbox=105.40,20.70,106.15,21.40&lat='+c.lat.toFixed(4)+'&lon='+c.lng.toFixed(4)+'&q='+encodeURIComponent(q))
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(j){
      searchHits=(j.features||[]).filter(function(f){ return f.geometry && f.geometry.coordinates; });
      if(!searchHits.length){ box.innerHTML='<div class="results"><div class="result">검색 결과가 없어요. 영어나 베트남어 이름으로 찾아보거나, 지도를 직접 움직여주세요</div></div>'; return; }
      box.innerHTML='<div class="results">'+searchHits.map(function(f,i){
        var pr=f.properties||{};
        var sub=[pr.housenumber&&pr.street?pr.housenumber+' '+pr.street:pr.street, pr.district, pr.city].filter(Boolean).join(', ');
        return '<button class="result" type="button" data-act="hit" data-i="'+i+'"><b>'+esc(pr.name||pr.street||'이름 없는 장소')+'</b>'+esc(sub)+'</button>';
      }).join('')+'<button class="result" type="button" data-act="hitclose">닫기</button></div>';
    })
    .catch(function(){ box.innerHTML='<div class="results"><div class="result">지금은 검색이 안 돼요. 지도를 직접 움직여 찾아주세요</div></div>'; });
}
function goSearchHit(i){
  var f=searchHits[i]; if(!f||!map) return;
  var ll=[f.geometry.coordinates[1], f.geometry.coordinates[0]];
  G('searchResults').innerHTML='';
  map.setView(ll,17);
  if(!picking){
    if(searchMarker) searchMarker.setLatLng(ll);
    else searchMarker=L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#FF7043',fillOpacity:1}).addTo(map);
  }
  G('map').scrollIntoView({behavior:'smooth',block:'center'});
}
function goMyLocation(){
  if(!map) return;
  if(!navigator.geolocation){ toast('이 기기에서는 위치를 쓸 수 없어요'); return; }
  toast('🧭 내 위치 찾는 중…');
  navigator.geolocation.getCurrentPosition(function(pos){
    var ll=[pos.coords.latitude,pos.coords.longitude];
    map.setView(ll,17);
    if(myLocMarker) myLocMarker.setLatLng(ll);
    else myLocMarker=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1E88E5',fillOpacity:1}).addTo(map);
  }, function(err){
    toast(err.code===1 ? '위치 권한을 허용해주세요' : '위치를 찾지 못했어요');
  }, {enableHighAccuracy:true, timeout:10000, maximumAge:60000});
}

/* ================= 분실물 ================= */
var lfFilter='all', lfType='lost';
function renderLost(){
  var all=data.lostfound||[];
  var list=all.filter(function(p){ return lfFilter==='all' || p.type===lfFilter; });
  if(!list.length){
    G('lfList').innerHTML=emptyBox('📭', all.length ? '해당하는 글이 없어요' : '아직 올라온 글이 없어요<br/>오른쪽 아래 ✏️ 글쓰기로 올려보세요');

}
function submitLost(){

        closeSheet('lostSheet');
        ['lfTitle','lfDesc','lfLoc','lfContact'].forEach(function(id){ G(id).value=''; });

      })
      .catch(postErr)
      .then(function(){ busy('lfSubmit',false); });

}

/* ================= 나눔 ================= */
var shFilter='all';
function renderShares(){

function submitShare(){

        closeSheet('shareSheet');

/* ================= 게시글 공통 ================= */
function postItem(col,p,badge,metaParts,isDone,doneLabel){
  var mine=isMine(p);
  if(isHidden(p)) return hiddenBox(col,p,mine);
  var thumb = safeImg(p.thumb) ? '<img class="thumb" src="'+p.thumb+'" alt="사진" data-act="photo" data-col="'+col+'" data-id="'+esc(p.id)+'"/>' : '';
  var meta = metaParts.filter(Boolean).concat(['🕐 '+timeAgo(tsMs(p.createdAt))]).map(function(m){ return '<span>'+m+'</span>'; }).join('');
  var ownerBtn = mine && !isDone ? '<button class="act primary" data-act="done" data-col="'+col+'" data-id="'+esc(p.id)+'">✅ '+doneLabel+'</button>' : '';
  return '<div class="item'+(isDone?' done':'')+'">'+thumb+'<div class="item-body">'+
    '<div class="item-top">'+badge+(mine?'<span class="badge b-mine">내 글</span>':'')+'<div class="item-title">'+esc(p.title)+'</div></div>'+
    (p.desc?'<div class="item-desc">'+esc(p.desc)+'</div>':'')+
    '<div class="item-meta">'+meta+'</div>'+
    '<div class="item-actions">'+ownerBtn+tailButton(col,p,mine)+'</div>'+
  '</div></div>';
}
// 내 글이면 삭제, 남의 글이면 신고
function tailButton(col,p,mine){
  var a='data-col="'+col+'" data-id="'+esc(p.id)+'"';
  if(mine) return '<button class="act warn" data-act="del" '+a+'>🗑 삭제</button>';
  var reported=!!uid && (p.reporters||[]).indexOf(uid)>=0;
  return reported ? '<button class="act" disabled>신고함</button>' : '<button class="act" data-act="report" '+a+'>🚩 신고</button>';
}
function hiddenBox(col,p,mine){
  return '<div class="hidden-post"><span>🚩 신고가 쌓여서 가려진 글이에요</span>'+
    (mine?'<button class="act warn" data-act="del" data-col="'+col+'" data-id="'+esc(p.id)+'">🗑 삭제</button>':'')+'</div>';
}
function lastPostAt(){ try{ return +localStorage.getItem('kishLastPost')||0; }catch(e){ return 0; } }
function tooSoon(){
  var wait=POST_GAP_MS-(Date.now()-lastPostAt());
  if(wait>0){ toast('⏳ 글은 30초에 한 번 올릴 수 있어요 ('+Math.ceil(wait/1000)+'초 남음)'); return true; }
  return false;
}
// 글 + 사진 + "마지막으로 글 쓴 시간"을 한 번에 저장 (하나라도 실패하면 전부 취소됨)
function createPost(col,doc,fullPhoto){
  var ref=db.collection(col).doc(), b=db.batch();
  b.set(ref, doc);
  if(fullPhoto) b.set(db.collection('photos').doc(ref.id), {data:fullPhoto, ownerUid:uid});
  b.set(db.collection('limits').doc(uid), {last:FV.serverTimestamp()});
  var slow=setTimeout(function(){ toast('인터넷이 느려요. 조금만 기다려주세요…'); },10000);
  return b.commit().then(function(){
    clearTimeout(slow);
    try{ localStorage.setItem('kishLastPost', String(Date.now())); }catch(e){}
    return ref.id;
  }, function(e){ clearTimeout(slow); throw e; });
}
function postErr(e){
  console.error(e);
  if(e && e.code==='permission-denied') toast('⚠️ 올리지 못했어요. 30초 뒤에 다시 해보고, 계속 안 되면 새로고침해주세요');
  else writeErr(e);
}
function writeErr(e){
  console.error(e);
  var code=e&&e.code;
  if(code==='permission-denied') toast('⚠️ 권한이 없어요. 새로고침 후 다시 해주세요');
  else if(code==='unavailable') toast('⚠️ 인터넷 연결을 확인해주세요');
  else toast('⚠️ 실패했어요. 잠시 후 다시 해주세요');
}
function okContact(c){
  if(/\d{3,4}[-\s.]?\d{3,4}[-\s.]?\d{3,4}/.test(c))
    return confirm('연락 방법에 전화번호가 있는 것 같아요.\n누구나 볼 수 있는데 그래도 올릴까요?');
  return true;
}
function reportPost(col,id){
  requireAuth(function(){
    if(!confirm('이 글을 신고할까요?\n신고가 '+REPORT_LIMIT+'번 쌓이면 글이 가려져요.')) return;
    db.collection(col).doc(id).update({reporters:FV.arrayUnion(uid)})
      .then(function(){ toast('신고했어요. 알려줘서 고마워요!'); }).catch(writeErr);
  });
}
function markDone(col,id){
  requireAuth(function(){
    var field = col==='lostfound' ? 'resolved' : 'done';
    if(!confirm(col==='lostfound' ? '해결됨으로 바꿀까요?\n(다시 되돌릴 수 없어요)' : '나눔완료로 바꿀까요?\n(다시 되돌릴 수 없어요)')) return;
    var u={}; u[field]=true;
    db.collection(col).doc(id).update(u).then(function(){ toast('✅ 바꿨어요'); }).catch(writeErr);
  });
}
function deletePost(col,id){
  requireAuth(function(){
    var p=findPost(col,id); if(!p) return;
    if(!confirm('정말 삭제할까요? 되돌릴 수 없어요.')) return;
    var b=db.batch();
    b.delete(db.collection(col).doc(id));
    if(p.hasPhoto) b.delete(db.collection('photos').doc(id));
    b.commit().then(function(){ toast('삭제했어요'); }).catch(writeErr);
  });
}

/* ================= 사진 ================= */
// 폰 사진(수 MB)을 작게 줄여서 저장: 목록용 작은 사진 + 눌렀을 때 보는 큰 사진
var photos={lf:null, sh:null}, photoTarget=null, photoCache={};
function pickPhoto(t){ photoTarget=t; G('photoInput').value=''; G('photoInput').click(); }
function onPhotoPicked(input){
  var f=input.files && input.files[0], t=photoTarget; if(!f||!t) return;
  G(t+'PhotoBtn').textContent='사진 준비 중…';
  preparePhoto(f).then(function(ph){ photos[t]=ph; showPhotoPreview(t); })
    .catch(function(){ toast('이 사진은 올릴 수 없어요. 다른 사진을 골라주세요'); photos[t]=null; showPhotoPreview(t); });
}
function showPhotoPreview(t){
  var ph=photos[t];
  G(t+'PhotoBtn').textContent = ph ? '📷 다른 사진' : '📷 사진 추가';
  G(t+'PhotoPrev').innerHTML = ph ? '<img src="'+ph.thumb+'" alt=""/><button type="button" onclick="removePhoto(\''+t+'\')" aria-label="사진 빼기">✕</button>' : '';
}
function removePhoto(t){ photos[t]=null; showPhotoPreview(t); }
function loadImg(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){ URL.revokeObjectURL(url); res(img); };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src=url;
  });
}
function toJpeg(img,maxSide,q){
  var w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1, maxSide/Math.max(w,h));
  var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*s)); c.height=Math.max(1,Math.round(h*s));
  var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', q);
}
function preparePhoto(file){
  return loadImg(file).then(function(img){
    if(!img.naturalWidth) throw new Error('empty');
    var side=1280, q=0.72, full=toJpeg(img,side,q);
    while(full.length>600000 && q>0.4){ q-=0.1; side=Math.max(800,side-160); full=toJpeg(img,side,q); }
    if(full.length>650000) throw new Error('too big');
    var thumb=toJpeg(img,200,0.6);
    if(thumb.length>38000) thumb=toJpeg(img,150,0.5);
    return {full:full, thumb:thumb};
  });
}
function openPhoto(id){
  G('viewer').hidden=false; G('viewerImg').removeAttribute('src'); G('viewerMsg').textContent='사진 불러오는 중…';
  function show(d){ if(safeImg(d)){ G('viewerImg').src=d; G('viewerMsg').textContent=''; } else G('viewerMsg').textContent='사진을 불러오지 못했어요'; }
  if(photoCache[id]) return show(photoCache[id]);
  db.collection('photos').doc(id).get().then(function(s){
    var d=s.exists ? s.data().data : ''; if(d) photoCache[id]=d; show(d);
  }).catch(function(){ G('viewerMsg').textContent='사진을 불러오지 못했어요'; });
}
function closeViewer(){ G('viewer').hidden=true; }

/* ================= 창 열고 닫기 ================= */
function openSheet(id){ G(id).hidden=false; document.body.style.overflow='hidden'; }
function closeSheet(id){ G(id).hidden=true; document.body.style.overflow=''; }
function openWrite(){ requireAuth(function(){ openSheet(curTab==='lost' ? 'lostSheet' : 'shareSheet'); }); }
document.querySelectorAll('.overlay').forEach(function(o){
  o.addEventListener('click', function(e){ if(e.target===o) closeSheet(o.id); });
});
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(!G('viewer').hidden) return closeViewer();
  document.querySelectorAll('.overlay').forEach(function(o){ if(!o.hidden) closeSheet(o.id); });
});
function markChips(boxId,v){ document.querySelectorAll('#'+boxId+' [data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); }); }
function markSeg(btn){ btn.parentNode.querySelectorAll('.seg-btn').forEach(function(b){ b.classList.toggle('on', b===btn); }); }

// 버튼 클릭을 한 곳에서 처리 (글 ID를 onclick 문자열에 넣지 않아 안전함)
document.addEventListener('click', function(e){
  var b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  var act=b.dataset.act, col=b.dataset.col, id=b.dataset.id;
  if(act==='like') toggleLike(id);
  else if(act==='focus') focusPlace(id);
  else if(act==='del') deletePost(col,id);
  else if(act==='report') reportPost(col,id);
  else if(act==='done') markDone(col,id);
  else if(act==='photo') openPhoto(id);
  else if(act==='hit') goSearchHit(+b.dataset.i);
  else if(act==='hitclose') G('searchResults').innerHTML='';
  else if(act==='cat'){ pCat=b.dataset.v; markChips('pCat',pCat); }
  else if(act==='catf'){ placeCat=b.dataset.v; markChips('catFilter',placeCat); renderPlaces(); }
  else if(act==='lff'){ lfFilter=b.dataset.v; markSeg(b); renderLost(); }
  else if(act==='shf'){ shFilter=b.dataset.v; markSeg(b); renderShares(); }
  else if(act==='lftype'){ lfType=b.dataset.v; markSeg(b); }
}, true);

var RENDER={places:renderPlaces, lostfound:renderLost, shares:renderShares};

// ── 시작 ──
G('pCat').innerHTML=CATS.map(function(c){ return '<button type="button" class="chip" data-act="cat" data-v="'+c[0]+'">'+c[1]+' '+c[0]+'</button>'; }).join('');
G('catFilter').innerHTML='<button type="button" class="chip on" data-act="catf" data-v="all">전체</button>'+
  CATS.map(function(c){ return '<button type="button" class="chip" data-act="catf" data-v="'+c[0]+'">'+c[1]+' '+c[0]+'</button>'; }).join('');
(function(){
  var start=(location.hash||'').slice(1);
  goTab(['map','lost','share'].indexOf(start)>=0 ? start : 'map');
})();
</script>
